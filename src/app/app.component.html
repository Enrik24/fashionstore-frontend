<div class="app-layout">
  <!-- Global Toast Notifications Container -->
  <app-toast></app-toast>

  <!-- Global Loading Indicator -->
  <app-loading></app-loading>

  <!-- Global Navbar (Only on public non-admin routes) -->
  @if (!isAdminRoute) {
    <app-navbar></app-navbar>
  }

  <!-- Main View Routing -->
  <div class="app-main-content">
    <router-outlet></router-outlet>
  </div>

  <!-- Global Footer (Only on public non-admin routes) -->
  @if (!isAdminRoute) {
    <app-footer></app-footer>
  }

  <!-- AI Smart Fashion Stylist Assistant Widget (Solo para clientes/rutas públicas) -->
  @if (!isAdminRoute) {
    <app-ai-chat-widget></app-ai-chat-widget>
  }
</div>
